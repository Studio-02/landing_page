<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>OPTISWARE LANDING PAGE</title>
</head>

<body>

  <header>

    <div class="brand">
      <a href="/" aria-label="Optisware home">Optisware</a>
    </div>

    <nav aria-label="Primary">

      <ul>
        <li>
          <a href="#product">Product</a>
        </li>
        <li><a href="#features">Features</a></li>
        <li><a href="#contact">Contact</a></li>
      </ul>
    </nav>


  </header>

  <main>

    <section id="product">
      <h1>Build smarter with AI</h1>
      <p>Optisware help to design, build, and ship software faster and more efficiently. </p>
    </section>

    <section id="features">
      <h2>Features</h2>

      <article>
        <h3> AI-Assisted Coding</h3>

        <p>Code with AI as a partner not a replacement</p>
      </article>

    </section>

  </main>

  <section id="contact">
    <h2>Contact Us</h2>

    <form>

      <label for="name">Name:</label>
      <input type="text" id="name" name="name" required>

      <label for="email">Email:</label>
      <input type="email" id="email" name="email" required>

      <lable for="message">Message:</label>
        <textarea id="message" name="message" required></textarea>


        <button type="submit">Submit</button></button>
    </form>
  </section>

</body>

</html>
